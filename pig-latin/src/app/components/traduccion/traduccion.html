<div class="traduccion-container">
  <div class="traduccion-header">
    <span class="title">Traducción a PigLatin</span>
    <span class="status" *ngIf="!hasTranslation">⚠️ Esperando compilación...</span>
    <span class="status success" *ngIf="hasTranslation">✅ Código compilado</span>
  </div>
  <div class="traduccion-content">
    <pre class="code-display">{{ translatedCode }}</pre>
  </div>
</div>
